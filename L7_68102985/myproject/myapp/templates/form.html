<!DOCTYPE html>
<html>
<head>
<title>ICT12367</title>

<style>

body{
    font-family: Arial;
    background:#f2f2f2;
}

.container{
    width:350px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
}

input, select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:10px;
    background:#28a745;
    border:none;
    color:white;
    font-size:16px;
    border-radius:5px;
}

</style>

</head>

<body>

<div class="container">

<h2>บันทึกข้อมูลพนักงาน</h2>

<form>

<label>Full Name</label>
<input type="text">

<label>Email</label>
<input type="email">

<label>Position</label>
<select>
<option>Manager</option>
<option>Designer</option>
<option>Developer</option>
</select>

<label>Phone Number</label>
<input type="text">

<button type="submit">Submit</button>

</form>

</div>

</body>
</html>
